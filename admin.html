<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau de bord | FEHSA</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><div class="admin-wrap"><div class="admin-top"><div><div class="eyebrow">Administration FEHSA</div><h1 style="margin:.2em 0">Inscriptions</h1><p style="margin:0;color:#6b6b72">Gérez les demandes reçues via le site.</p></div><div style="display:flex;gap:10px"><a class="btn btn-light" href="/api/admin/export.csv">Exporter CSV</a><form method="post" action="/admin/logout"><button class="btn btn-primary">Déconnexion</button></form></div></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Inscrit</th><th>Contact</th><th>Discipline</th><th>Urgence</th><th>Message</th><th>Date</th><th>Statut</th></tr></thead><tbody id="rows"><tr><td colspan="8">Chargement…</td></tr></tbody></table></div></div><script>async function load(){const r=await fetch('/api/admin/registrations');const data=await r.json();const el=document.getElementById('rows');if(!data.length){el.innerHTML='<tr><td colspan="8">Aucune inscription pour le moment.</td></tr>';return}el.innerHTML=data.map(x=>`<tr><td>${x.id}</td><td><strong>${esc(x.first_name)} ${esc(x.last_name)}</strong><br>${esc(x.birth_date||'')}</td><td>${esc(x.phone)}<br>${esc(x.email||'')}<br>${esc(x.address||'')}</td><td>${esc(x.discipline)}</td><td>${esc(x.emergency_contact||'')}<br>${esc(x.emergency_phone||'')}</td><td>${esc(x.message||'')}</td><td>${new Date(x.created_at.replace(' ','T')+'Z').toLocaleString('fr-FR')}</td><td><select onchange="status(${x.id},this.value)">${['Nouvelle','En cours','Traitée','Archivée'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function status(id,value){await fetch('/api/admin/registrations/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:value})})}load();</script></body></html>
